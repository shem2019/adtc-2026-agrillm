<rect x="86.0" y="624.0" width="1116.0" height="62" rx="7" fill="#f2f8f4" stroke="#aedbba"/>
<text x="100.0" y="647.0" font-size="12.5" font-weight="700" fill="#1a7f37">Why 78.9% was shipped over 80.2% and 81.7%</text>
<text x="100.0" y="665.0" font-size="11.5" fill="#1f2328">Both gaps sit inside the ±6-point sampling noise, so neither is a real difference. The 81.7% model finished at a training loss of 0.021 against 0.594 — it had memorised</text>
<text x="100.0" y="681.0" font-size="11.5" fill="#1f2328">the corpus rather than learned from it. Reading the raw answers separated them: only this checkpoint names aflatoxin, identifies nitrogen deficiency and gets both cassava diseases right.</text>
<text x="86" y="732" font-size="11" fill="#57606a">Round 1 shipped a LoRA adapter trained with MLX on Apple Silicon; it was never run against this harness, so it has no point here.</text>
